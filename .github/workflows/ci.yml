name: Industrial Control CI
on:
  push:
  pull_request:
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Build controller + remote I/O node (PlatformIO native)
        run: pio run
      - name: PlatformIO Unity tests (control, ST runtime + differential, Modbus/fuzz)
        run: pio test -e test
      - name: Plain GCC build (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/build_native.sh
      - name: Check Python syntax
        run: python -m compileall -q gateway scripts tests_python
      - name: Real-TCP/Modbus integration tests (local I/O, ST engine, remote I/O)
        run: python -m unittest discover -s tests_python -v
