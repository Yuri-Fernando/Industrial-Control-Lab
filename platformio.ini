; Industrial Control Lab — PlatformIO "native" platform (host GCC; no board required).
; Works on Linux/WSL (POSIX sockets) and on Windows with MinGW-w64 GCC on PATH (Winsock2).
; PlatformIO does not install a host compiler: install build-essential (Linux) or MinGW-w64/MSYS2 (Windows).

[platformio]
default_envs = native, io_node
; Optional machine-local overrides (gitignored), e.g. build_dir outside a cloud-synced folder:
;   [platformio]
;   build_dir = D:/build/icl-pio
extra_configs = platformio_local*.ini

[env]
platform = native
build_flags = -std=gnu++17 -O2 -Wall -Wextra -pthread -DUNITY_INCLUDE_DOUBLE
extra_scripts = pre:scripts/pio_host_libs.py
test_framework = unity
lib_ldf_mode = deep+

; Soft-PLC controller process (Modbus TCP server :15020) — `pio run -e native -t exec`
[env:native]
build_src_filter = +<*> -<io_node/>
test_ignore = *

; Remote I/O node process (Modbus TCP server :15021) — `pio run -e io_node -t exec`
[env:io_node]
build_src_filter = -<*> +<io_node/>
test_ignore = *

; Unity unit tests — `pio test -e test`. Separate env so the test runner never overwrites
; .pio/build/native/program(.exe), which the stack launcher and integration tests execute.
[env:test]
build_src_filter = -<*>
